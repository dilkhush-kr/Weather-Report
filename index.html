<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
      <h1>WEATHER APP</h1>
      <div class="tab-container">
        <p class="tab" data-userWeather>Your Weather</p>
        <p class="tab" data-searchWeather>Search Weather</p>
      </div>
      <div class="weather-container">
           <!-- grant-container -->
         <div class="sub-container  grantContainer">
             <img src="./image/location.png"  width="80" height="80" loading="lazy">
             <p>GrantLocationAccess</p>
             <p>Allow Acess To Get Weather Information</p>
            <button class="btn" data-grantAcessBtn>GRANT ACCESS</button>
         </div>
           <!-- search container -->
         <form class="searchContainer" data-searchContainer>
            <input placeholder="Search for city..." data-searchInput>
            <button class="btn" type="submit">
                <img src="./image/search.png" width="20" height="20" loading="lazy">
            </button>
          </form>
            <!-- loading container -->
          <div class="sub-container loadingContainer">
             <img src="./image/loading.gif" width="150" height="150" >
             <p>loading</p>
          </div>
            <!-- show weather info -->
           <div class="sub-container user-info-weather">
               <!-- city name and country flag img -->
              <div class="name">
                <p data-cityName></p>
                <img data-country-icon>
              </div>

              <!-- weather discription -->
              <p data-weatherDescription></p>
              <!-- cloud-image -->
              <img data-cloud-image>
              <!-- tempreature -->
              <p data-temp></p>
             
              <!-- 3 card parameter-->

              <div class="parameter-container">
                  <!-- card-1 -->
                 <div class="parameter">
                    <img src="./image/wind.png" >
                    <p>WINDSPEED</p>
                    <p data-windSpeed></p>
                  </div>
                   <!-- card-2 -->
                  <div class="parameter">
                    <img src="./image/humidity.png" >
                    <p>HUMIDITY</p>
                    <p data-humidity></p>
                  </div>
                    <!-- card-3 -->
                   <div class="parameter">
                    <img src="./image/cloud.png" >
                    <p>CLOUDS</p>
                    <P data-clouds></P>
                   </div>
              </div>
                
            </div>
             

      </div>
    </div>
    
   
    <script src="index.js"></script>
</body>
</html>
